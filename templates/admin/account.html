{% extends 'admin/base.html' %}{% block title %}My password{% endblock %}
{% block body %}
<h1>Change my password</h1>{% if session.must_change %}<p class="flash warn">For your safety, please choose your own password now.</p>{% endif %}
<form method="post" class="card form narrow"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label>Current password<input type="password" name="current" autocomplete="current-password" required></label>
<label>New password (at least 10 characters)<input type="password" name="new" autocomplete="new-password" minlength="10" required></label>
<label>New password again<input type="password" name="again" autocomplete="new-password" minlength="10" required></label>
<div class="savebar"><button class="btn">Change password</button></div></form>
{% endblock %}
